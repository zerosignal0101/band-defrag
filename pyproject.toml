[project]
name = "band-defrag"
version = "0.1.0"
description = ""
authors = [
    {name = "zerosignal",email = "zerosignal0101@proton.me"}
]
readme = "README.md"
requires-python = ">=3.11, <=3.12"
dependencies = [
    "gym (>=0.26.2,<0.27.0)",
    "pandas (>=2.3.2,<3.0.0)",
    "networkx (>=3.5,<4.0)",
    "numpy (==1.26.4)",
    "tensorboardx (>=2.6.4,<3.0.0)",
    "numba (>=0.62.0,<0.63.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)"
]

[tool.poetry]
packages = [{include = "band_defrag", from = "src"}]

[[tool.poetry.source]]
name = "my_mirror"
url = "https://mirrors.bfsu.edu.cn/pypi/web/simple"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
