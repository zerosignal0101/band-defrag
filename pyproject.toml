[project]
name = "band-defrag"
version = "0.1.0"
description = ""
authors = [
    {name = "zerosignal",email = "zerosignal0101@proton.me"}
]
readme = "README.md"
requires-python = ">=3.11, <=3.12"
dependencies = [
    "gym (>=0.26.2,<0.27.0)",
    "pandas (>=2.3.2,<3.0.0)",
    "networkx (>=3.5,<4.0)",
